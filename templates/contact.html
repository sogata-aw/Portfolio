<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Me contacter</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/default-style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/contact-style.css') }}">
</head>
<body>
    <header>
        {% include "header.html" ignore missing %}
    </header>
    <main>
        <form name="contact-form" id="contactForm">
            <div>
                <div class="input">
                    <div class="label">
                        <label for="name">Nom :</label>
                        <input id="name" type="text" name="nom" placeholder="Votre nom" autofocus required>
                    </div>
                    <div class="label">
                        <label for="prenom">Prénom :</label>
                        <input type="text" name="prenom" id="prenom" placeholder="Votre prénom" required>
                    </div>

                </div>
                <div class="input">
                    <div class="label">
                        <label for="email">Adresse mail :</label>
                        <input type="email" name="email" id="email" placeholder="Votre adresse mail" required>
                    </div>
                    <div class="label">
                        <label for="num">Votre numéro de téléphone :</label>
                        <input type="tel" name="num" id="num" pattern="0[1-9](?:[0-9]{2}){4}" placeholder="Votre numéro de téléphone">
                    </div>
                </div>
                <div class="label">
                    <label for="message">Écrivez votre message :</label>
                    <textarea name="message" id="message" required></textarea>
                </div>
                <button type="submit" class="for">Envoyer</button>
            </div>
        </form>
    </main>
    <footer class="petit">
        <div>
            <h4>Me contacter</h4>
            <p><b>Numéro de téléphone :</b> 07 83 59 26 01<br><b>Adresse Mail :</b> Maxime.rastelli@etu.univ-grenoble-alpes.fr</p>
        </div>
        <div>
            <h4>Mes réseaux</h4>
            <p><a href="https://www.linkedin.com/in/maxime-rastelli-19146b290/">LinkedIn</a><br><a href="https://github.com/sogata-aw">Github</a></p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="{{ url_for('static', path='js/view_contact.js') }}"></script>
    <script>
        contactForm.addEventListener("submit", (event) => {
            event.preventDefault(); // Empêche le rechargement de la page

            let form = new FormData(document.forms["contactForm"])

            fetch("/send_mail", {
                method: "POST",
                body: JSON.stringify({
                    nom: form.get("nom"),
                    prenom: form.get("prenom"),
                    email: form.get("email"),
                    num: form.get("num"),
                    message: form.get("message")
                }),
                headers: {
                    "Content-type": "application/json; charset=UTF-8"
                }
            })
            .then(response => {
                if(response.ok){
                    alert("E-mail envoyé avec succès !");
                }else{
                    alert("Une erreur est survenue...")
                }
                document.getElementById("contactForm").reset();
            })
            .catch(error => {
                console.error("Erreur:", error);
            });
        });
    </script>
</body>
</html>
